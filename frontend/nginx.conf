server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # static file falls back to index.html so deep links (e.g.
    # /projects/<id>) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately; hashed static assets are safe to cache aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
