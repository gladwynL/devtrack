services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtrack}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtrack} -d ${POSTGRES_DB:-devtrack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devtrack

  # One-off migration runner. Not started by `docker compose up`; run it
  # explicitly before (re)starting `backend` against a new/updated schema:
  #
  #   docker compose run --rm migrate
  #
  # Kept separate from `backend`'s own startup so migrations are an
  # explicit, visible step rather than something hidden inside app boot.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-devtrack}:${POSTGRES_PASSWORD:-devtrack}@postgres:5432/${POSTGRES_DB:-devtrack}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtrack
    profiles:
      - tools

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-devtrack}:${POSTGRES_PASSWORD:-devtrack}@postgres:5432/${POSTGRES_DB:-devtrack}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-dev-secret-change-me-before-deploying-anywhere-real}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # The frontend container is reached by the browser at localhost:FRONTEND_PORT,
      # not by its Docker service name, so that's what must be allowed here.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devtrack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be reachable from the browser, not Docker-internal — see
        # frontend/Dockerfile and README for why this can't be the service
        # name `backend`.
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - devtrack

networks:
  devtrack:

volumes:
  postgres_data:
