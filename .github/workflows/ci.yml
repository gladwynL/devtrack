name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

      - run: python -m ruff check .

      - run: python -m ruff format --check .

  frontend:
    name: Frontend (vitest, build, eslint, prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run test

      - run: npm run build

      - run: npm run lint

      - run: npm run format:check

  postgres-migrations:
    name: Alembic migrations (real PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway credentials for a CI-only service container — never used
      # outside this job. No production secret is required for CI.
      DATABASE_URL: postgresql+psycopg2://devtrack:devtrack@localhost:5432/devtrack
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg2://devtrack:devtrack@localhost:5432/devtrack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Verify the full migration chain applies cleanly to a fresh database,
      # and that it can also be fully reversed and re-applied.
      - name: Upgrade to head
        run: python -m alembic upgrade head

      - name: Downgrade to base
        run: python -m alembic downgrade base

      - name: Upgrade to head again
        run: python -m alembic upgrade head

      - name: Run the PostgreSQL integration test
        run: python -m pytest tests/test_postgres_integration.py -v
